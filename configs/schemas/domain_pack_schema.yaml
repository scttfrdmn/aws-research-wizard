# Domain Pack Configuration Schema
schema_version: "0.2.1-alpha"
schema_metadata:
  version: "0.2.1-alpha"
  created: "2024-12-15"
  last_modified: "2025-07-10"
  compatibility:
    min_config_version: "0.2.0-alpha"
    max_config_version: "0.x.x"
  breaking_changes:
    - version: "2.0.0"
      description: "Added required aws_instance_recommendations field and config versioning"
      migration: "Use migration tool: scripts/migrate-v1-to-v2.py"
    - version: "2.1.0"
      description: "Added config_version requirement and metadata tracking"
      migration: "Add config_version and config_metadata fields"

type: object
required:
  - config_version
  - name
  - description
  - primary_domains
  - target_users
  - spack_packages
  - aws_instance_recommendations
  - estimated_cost
  - research_capabilities

properties:
  config_version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+(-alpha|-beta|-rc\\d+)?$"
    description: "Semantic version of this configuration (MAJOR.MINOR.PATCH with optional pre-release)"

  config_metadata:
    type: object
    properties:
      created:
        type: string
        format: date
        description: "Date when this configuration was first created"
      last_modified:
        type: string
        format: date
        description: "Date when this configuration was last modified"
      schema_compatibility:
        type: string
        pattern: "^\\d+\\.\\d+\\.\\d+(-alpha|-beta|-rc\\d+)?$"
        description: "Compatible schema version"
      change_log:
        type: array
        items:
          type: object
          properties:
            version:
              type: string
              pattern: "^\\d+\\.\\d+\\.\\d+(-alpha|-beta|-rc\\d+)?$"
            date:
              type: string
              format: date
            changes:
              type: array
              items:
                type: string
    required: ["created", "last_modified", "schema_compatibility"]

  name:
    type: string
    description: "Human-readable name of the research pack"

  description:
    type: string
    description: "Detailed description of the pack's purpose and capabilities"

  primary_domains:
    type: array
    items:
      type: string
    description: "List of primary research domains this pack serves"

  target_users:
    type: string
    description: "Description of intended user base and scale"

  spack_packages:
    type: object
    description: "Categorized Spack package specifications"
    patternProperties:
      "^[a-zA-Z_]+$":
        type: array
        items:
          type: string
          pattern: "^[a-zA-Z0-9@.+_-]+.*$"

  aws_instance_recommendations:
    type: object
    description: "AWS instance configurations for different use cases"
    patternProperties:
      "^[a-zA-Z_]+$":
        type: object
        required:
          - instance_type
          - vcpus
          - memory_gb
          - cost_per_hour
          - use_case
        properties:
          instance_type:
            type: string
            pattern: "^[a-z0-9]+\\.[a-z0-9]+$"
          vcpus:
            type: integer
            minimum: 1
          memory_gb:
            type: integer
            minimum: 1
          storage_gb:
            type: integer
            minimum: 10
          cost_per_hour:
            type: number
            minimum: 0
          use_case:
            type: string
          efa_enabled:
            type: boolean
            default: false
          placement_group:
            type: string
            enum: ["cluster", "partition", "spread"]
          enhanced_networking:
            type: string
            enum: ["sr-iov", "standard"]
          network_performance:
            type: string

  estimated_cost:
    type: object
    required:
      - compute
      - storage
      - total
    properties:
      compute:
        type: number
        minimum: 0
      storage:
        type: number
        minimum: 0
      network:
        type: number
        minimum: 0
      data_transfer:
        type: number
        minimum: 0
      total:
        type: number
        minimum: 0

  research_capabilities:
    type: array
    items:
      type: string
    description: "List of specific research capabilities enabled"

  aws_data_sources:
    type: array
    items:
      type: string
    description: "Optional AWS data sources and services used"

  demo_workflows:
    type: array
    items:
      type: object
      required:
        - name
        - description
        - dataset
      properties:
        name:
          type: string
        description:
          type: string
        dataset:
          type: string
        expected_runtime:
          type: string
        cost_estimate:
          type: number

  mpi_optimizations:
    type: object
    properties:
      efa_enabled:
        type: boolean
        default: false
      max_nodes:
        type: integer
        minimum: 1
        maximum: 64
      placement_strategy:
        type: string
        enum: ["cluster", "partition", "spread"]
      network_backend:
        type: string
        enum: ["efa", "enhanced_networking", "standard"]
