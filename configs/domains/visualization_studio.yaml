name: Scientific Visualization Studio
description: Comprehensive scientific visualization and interactive analysis platform
primary_domains:
- Scientific Visualization
- Data Science
- High-Performance Computing
- Interactive Analytics
- Research Computing
target_users: Data scientists, visualization specialists, research software engineers,
  domain scientists (1-8 users)
spack_packages:
  core_packages:
  - python
  - python-numpy
  - python-pandas
  - python-scipy
  - python-matplotlib
  - python-seaborn
  - python-plotly
  - python-bokeh
  - python-altair
  - r-base
  - r-ggplot2
  - r-plotly
  - julia
  - nodejs
  - d3js
  specialized_tools:
  - paraview
  - visit
  - vtk
  - mayavi
  - python-pyvista
  - python-vispy
  - python-holoviews
  - python-datashader
  - python-panel
  - jupyter-lab
  - jupyter-widgets
  - python-ipywidgets
  - python-voila
  - python-streamlit
  - python-dash
  - python-flask
  - python-fastapi
  - observablehq
  - python-cupy
  - python-rapids
  - python-cucim
  - blender
  - paraview-gpu
  - python-taichi
  - python-napari
  - python-itk
  - python-simpleitk
  - python-pymol
  - python-nglview
  - python-folium
  - python-geoviews
  - python-cartopy
  - python-xarray
  - python-dask
  - python-zarr
  - python-netcdf4
  - python-h5py
  - python-gdal
  - python-rasterio
  - ffmpeg
  development_tools:
  - git
  - docker
  - kubernetes
  - vscode
  - jupyter-lab
  - conda
  - pip
aws_instance_recommendations:
  development:
    instance_type: g4dn.xlarge
    vcpus: 4
    memory_gb: 16
    storage_gb: 200
    cost_per_hour: 0.526
    use_case: Small visualization development and prototyping
  visualization_medium:
    instance_type: g4dn.2xlarge
    vcpus: 8
    memory_gb: 32
    storage_gb: 500
    cost_per_hour: 0.752
    use_case: Medium-scale interactive visualizations
  visualization_large:
    instance_type: g5.8xlarge
    vcpus: 32
    memory_gb: 128
    storage_gb: 1000
    cost_per_hour: 2.448
    use_case: Large-scale visualization and rendering
estimated_cost:
  compute: 1800
  storage: 500
  data_transfer: 150
  gpu_acceleration: 400
  total: 2850
research_capabilities:
- Interactive scientific data visualization
- Large-scale rendering and animation
- Real-time data streaming visualization
- Virtual and augmented reality experiences
- Collaborative visualization environments
- High-performance GPU-accelerated rendering
- Publication-quality figure generation
- Web-based visualization deployment
data:
  typical_datasets:
  - name: Climate Model Output
    size: 100-10000 GB
    description: NetCDF climate simulation results
  - name: Medical Imaging Studies
    size: 50-5000 GB
    description: DICOM medical imaging datasets
  - name: Satellite Earth Observation
    size: 200-20000 GB
    description: Multi-spectral satellite imagery
  - name: Molecular Dynamics Simulations
    size: 100-1000 GB
    description: Protein and material simulation trajectories
  - name: Microscopy and Imaging
    size: 50-500 GB
    description: High-resolution scientific imaging data
  aws_open_data:
  - name: Landsat Imagery
    bucket: landsat-pds
    description: Global satellite imagery for visualization
  - name: NOAA Weather Data
    bucket: noaa-gfs-bdp-pds
    description: Weather and climate visualization data
  - name: NASA Earth Data
    bucket: nasa-eosdis-data
    description: Earth observation and space science data
workflows:
- name: Interactive Data Dashboard
  description: Create interactive web-based visualization dashboard
  steps:
  - Import and process scientific datasets
  - Design interactive visualization components
  - Develop responsive web interface
  - Deploy collaborative dashboard
  - Set up real-time data updates
- name: Large-Scale Rendering
  description: Render high-resolution scientific visualizations
  steps:
  - Load large-scale simulation data
  - Configure parallel rendering pipeline
  - Generate high-quality visualizations
  - Create animation sequences
  - Export publication-ready outputs
- name: VR/AR Visualization
  description: Create immersive virtual reality experiences
  steps:
  - Process 3D scientific data
  - Design VR interaction interfaces
  - Optimize for real-time rendering
  - Deploy to VR platforms
  - Enable collaborative VR sessions
- name: Collaborative Visualization
  description: Set up shared visualization environment
  steps:
  - Configure multi-user visualization server
  - Set up collaborative data access
  - Enable real-time collaboration features
  - Deploy web-based interface
  - Manage user access and permissions
security:
  compliance_frameworks:
  - SOC 2 Type II
  - HIPAA
  - FERPA
  - GDPR
  data_encryption: true
  access_controls: true
  audit_logging: true
  network_isolation: true
optimization:
  auto_scaling:
    enabled: true
    min_instances: 1
    max_instances: 10
    target_gpu: 80
    scale_on_queue: true
  cost_optimization:
    spot_instances: true
    scheduled_shutdown: true
    idle_timeout: 30
    gpu_scheduling: true
    preemptible_rendering: true
  performance:
    ebs_optimized: true
    enhanced_networking: true
    gpu_optimization: true
    nvlink_enabled: true
    high_memory_instances: true
  rendering_optimization:
    distributed_rendering: true
    gpu_memory_optimization: true
    parallel_processing: true
    cache_optimization: true
    compression_enabled: true
  collaboration:
    shared_workspaces: true
    version_control: true
    real_time_sync: true
    multi_user_support: true
    web_deployment: true
  data_management:
    backup_enabled: true
    backup_retention: 30
    automated_snapshots: true
    data_compression: true
    intelligent_tiering: true
    cdn_acceleration: true
config_version: 0.2.1-alpha
config_metadata:
  created: '2024-12-15'
  last_modified: '2025-07-02'
  schema_compatibility: 0.2.1-alpha
  change_log:
