# Conda package template for aws-research-wizard
# This will be used to create the conda-forge recipe

package:
  name: aws-research-wizard
  version: 0.3.1

source:
  url: https://github.com/scttfrdmn/aws-research-wizard/releases/download/v0.3.1/aws-research-wizard-linux-amd64.tar.gz
  sha256: # TO BE FILLED WITH ACTUAL SHA256

build:
  number: 0
  script: |
    mkdir -p ${PREFIX}/bin
    cp aws-research-wizard ${PREFIX}/bin/
    chmod +x ${PREFIX}/bin/aws-research-wizard

requirements:
  build:
    - go >=1.21
  run:
    - terraform >=1.0
    - aws-cli >=2.0

test:
  commands:
    - aws-research-wizard --version
    - aws-research-wizard config --help

about:
  home: https://researchwizard.app
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Easily run research workloads in the cloud - 27 research domains with 20-minute tutorials
  description: |
    AWS Research Wizard helps you easily run research workloads in the cloud
    with pre-configured environments for 27 research domains. Features include:

    - 20-minute step-by-step tutorials using real research data
    - Pre-configured environments for genomics, climate modeling, machine learning, and more
    - Smart cost optimization with spot instances and automatic scaling
    - Real research data from AWS Open Data Registry (1000 Genomes, ERA5, TCGA)
    - One-command deployment of complete research environments

    No cloud expertise needed - just follow the tutorials and start researching!
  doc_url: https://researchwizard.app
  dev_url: https://github.com/scttfrdmn/aws-research-wizard

extra:
  recipe-maintainers:
    - scttfrdmn
