<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}

  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

  <!-- Search functionality -->
  <script src="https://unpkg.com/lunr/lunr.js"></script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ '/wizard-logo.png' | relative_url }}">
</head>

<body>
  <div class="container-lg px-3 my-5 markdown-body">

    <header class="site-header">
      <div class="header-content">
        <div class="logo">
          <img src="{{ '/wizard-logo.png' | relative_url }}" alt="AWS Research Wizard" height="40">
          <span class="site-title">{{ site.title }}</span>
        </div>

        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/domain-guides/' | relative_url }}">Research Areas</a>
          <a href="{{ '/getting-started/' | relative_url }}">Get Started</a>
          <a href="https://github.com/scttfrdmn/aws-research-wizard">GitHub</a>
        </nav>

        <div class="search-container">
          <input type="text" id="search-input" placeholder="Search documentation...">
          <div id="search-results"></div>
        </div>
      </div>
    </header>

    <main class="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <p>&copy; 2025 AWS Research Wizard. Open source under MIT License.</p>
        <div class="footer-links">
          <a href="https://github.com/scttfrdmn/aws-research-wizard">GitHub</a>
          <a href="https://github.com/scttfrdmn/aws-research-wizard/issues">Support</a>
          <a href="https://github.com/scttfrdmn/aws-research-wizard/blob/main/LICENSE">License</a>
        </div>
      </div>
    </footer>
  </div>

  <!-- Search script -->
  <script src="{{ '/assets/js/search.js' | relative_url }}"></script>

  <!-- Analytics placeholder -->
  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
</body>
</html>
