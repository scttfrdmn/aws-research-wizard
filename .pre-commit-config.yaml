repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags
      - id: check-json
        exclude: '^docs/search\.json$'  # Exclude Jekyll template files
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict

  # YAML linting and validation
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ['-c', '.yamllint.yaml']
        types: [yaml]

  # Go linting and formatting (configured for go subdirectory)
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        args: ['-w']
        files: '^go/.*\.go$'
      - id: go-vet
        entry: bash -c "cd go && go vet ./..."
        language: system
        files: '^go/.*\.go$'
        pass_filenames: false
      - id: go-mod-tidy
        entry: bash -c "cd go && go mod tidy"
        language: system
        files: '^go/(go\.mod|go\.sum|.*\.go)$'
        pass_filenames: false

  # Advanced Go linting (disabled due to version conflicts)
  # - repo: https://github.com/golangci/golangci-lint
  #   rev: v2.2.1
  #   hooks:
  #     - id: golangci-lint
  #       entry: bash -c "cd go && golangci-lint run --timeout=5m"
  #       language: system
  #       files: '^go/.*\.go$'
  #       pass_filenames: false

  # Security scanning will be handled by the comprehensive linting script

  # Domain Pack Validation
  - repo: local
    hooks:
      - id: domain-pack-validation
        name: Domain Pack Schema Validation
        entry: python3 scripts/validate-domain-configs.py
        language: system
        files: '^configs/domains/.*\.yaml$'
        pass_filenames: false

      - id: yaml-syntax-check
        name: Advanced YAML Syntax Check
        entry: python3 -c "import yaml; import sys; [yaml.safe_load(open(f)) for f in sys.argv[1:]]"
        language: system
        files: '\.ya?ml$'

  # Basic Go checks
  - repo: local
    hooks:
      - id: go-build-check
        name: Go Build Check
        entry: bash -c "cd go && go build -v ./..."
        language: system
        files: '\.go$'
        pass_filenames: false

      - id: go-test-basic
        name: Go Test Basic
        entry: bash -c "cd go && go test ./..."
        language: system
        files: '\.go$'
        pass_filenames: false
